<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5F8;--surface:#FFFFFF;--ink:#14213D;--muted:#586178;--line:#DCE1EA;
  --brand:#FFC53D;--brand-ink:#14213D;--accent:#0B7A75;--danger:#B93A2E;--star:#E39B00;--soft:#EAF0F7;
  --radius:14px;
  --disp:'Bricolage Grotesque','Noto Sans Tamil',system-ui,sans-serif;
  --body:'Nunito Sans','Noto Sans Tamil',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424;--surface:#161F36;--ink:#EDF0F7;--muted:#9AA5BD;--line:#2A3552;--accent:#3CC4BF;--danger:#FF7B6E;--star:#FFC53D;--soft:#1E2947;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1424;--surface:#161F36;--ink:#EDF0F7;--muted:#9AA5BD;--line:#2A3552;--accent:#3CC4BF;--danger:#FF7B6E;--star:#FFC53D;--soft:#1E2947;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;font-size:16px}
html[lang="ta"] body{line-height:1.7}
h1,h2,h3{font-family:var(--disp);line-height:1.2;margin:0}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--disp);font-weight:800;font-size:20px}
.brand b{background:var(--brand);color:var(--brand-ink);padding:2px 9px;border-radius:8px;letter-spacing:-.02em}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{text-decoration:none;padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
nav a.on{background:var(--ink);color:var(--surface)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:6px 12px;cursor:pointer;min-height:34px}
.lang button.on{background:var(--brand);color:var(--brand-ink)}
main{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
.foot{max-width:1040px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px}

.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.green{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 11px;min-height:34px;font-size:14px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer;margin:14px 0 6px;font-size:15px}
.chk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 180px}

.hero{background:var(--ink);color:#fff;border-radius:18px;padding:22px 18px}
.hero h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:8px 0 16px;color:#C9D2E6;max-width:60ch}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:2 1 240px;border-color:transparent}
.search select{flex:1 1 150px;border-color:transparent}
.dbtn{appearance:none;margin-top:12px;border:1.5px solid #C9D2E6;background:transparent;color:#fff;font:inherit;font-weight:700;border-radius:999px;padding:7px 15px;cursor:pointer}
.dbtn.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:16px 0}
.cat{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 6px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.cat span{font-size:26px;line-height:1.2}
.cat.on{border-color:var(--ink);background:var(--brand);color:var(--brand-ink)}
.count{color:var(--muted);font-weight:600;margin:6px 0 12px}

.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))}
.vcard{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;cursor:pointer}
.vph{width:108px;height:108px;object-fit:cover;border-radius:10px;flex:none;background:var(--soft)}
.vbody{min-width:0;flex:1}
.vname{font-family:var(--disp);font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);display:inline-block}
.vname:hover{text-decoration:underline}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:600}
.rate{font-weight:700;font-size:14px;margin-top:2px}
.star{color:var(--star)}
.chip{display:inline-block;background:var(--soft);color:var(--accent);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
.chip.del{background:var(--brand);color:var(--brand-ink)}
.thumbs{display:flex;gap:6px;margin-top:8px;align-items:center}
.thumbs img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.thumbs small{color:var(--muted);font-weight:700}

.back{display:inline-block;margin:0 0 10px;font-weight:700;color:var(--muted);text-decoration:none}
.cover{width:100%;aspect-ratio:16/6;object-fit:cover;border-radius:16px;background:var(--soft)}
.vhead{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:14px 0}
.vhead h1{font-size:clamp(26px,5vw,34px);font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
h2.sec{font-size:22px;margin:26px 0 12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.scard img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft)}
.scard div{padding:10px 12px 14px}
.scard h3{font-size:17px}
.price{color:var(--accent);font-weight:800;margin-top:2px}
.scard p{margin:6px 0 0;color:var(--muted);font-size:14px}
.review{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.review .reply{margin-top:8px;padding-left:10px;border-left:3px solid var(--brand);color:var(--muted);font-size:14px}
.stars-in{display:flex;gap:4px}
.stars-in button{appearance:none;background:none;border:0;font-size:30px;cursor:pointer;color:var(--line);padding:0 2px}
.stars-in button.on{color:var(--star)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.dbox{margin:14px 0 0;border-color:var(--brand);border-width:2px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--disp);font-size:28px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px;font-weight:700}
.banner{border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:700;background:#FFF1CC;color:#5A4200}
.banner.bad{background:#FFE1DD;color:#7A1E15}
.trow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;flex-wrap:wrap}
.trow img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.trow .grow{flex:1 1 200px;min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.pill{font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft)}
.pill.active{background:#D6F3E4;color:#116139}
.pill.pending{background:#FFF1CC;color:#5A4200}
.pill.blocked{background:#FFE1DD;color:#7A1E15}
dialog{border:0;border-radius:16px;padding:18px;width:min(520px,94vw);background:var(--surface);color:var(--ink);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(10,15,30,.55)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;max-width:92vw}
/* area auto-suggest */
.ac{position:relative}
.ac input{width:100%}
.aclist{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;max-height:216px;overflow:auto;box-shadow:0 12px 28px rgba(10,15,30,.18);padding:4px}
.aclist button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:9px 10px;border-radius:8px;cursor:pointer;min-height:42px}
.aclist button:hover,.aclist button:focus-visible{background:var(--soft)}
.aclist button.new{color:var(--accent);font-weight:800}
.aclist button.none{color:var(--muted);font-weight:600;cursor:default}
.search .ac{flex:1 1 170px}
.search .ac input{border-color:transparent}
/* fixed multi-area picker: pick-only, no typing */
.achips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px}
.achip{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:42px}
.achip.on{background:var(--brand);border-color:var(--ink);color:var(--brand-ink)}
.ahint{color:var(--muted);font-size:13px;margin:5px 0 0}
/* icon library */
.iconbox{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--surface)}
.iconbox summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconbox summary::-webkit-details-marker{display:none}
.iconbox summary::before{content:'▸';color:var(--muted)}
.iconbox[open] summary::before{content:'▾'}
.igroups{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.igroups button{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:13px;border-radius:999px;padding:5px 11px;cursor:pointer;min-height:34px}
.igroups button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:190px;overflow:auto;padding:2px}
.icongrid button{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:24px;line-height:1;padding:8px 0;cursor:pointer;min-height:44px}
.icongrid button.on{background:var(--brand);border-color:var(--ink)}
.ihint{color:var(--muted);font-size:13px;margin:8px 0 0}
@media (max-width:520px){.vph{width:88px;height:88px}.cover{aspect-ratio:16/8}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}

function pushCloud(){
  if(!fsdb||!cloudReady)return;
  const batch=fsdb.batch();let any=false;
  const diff=(colName,arr,map)=>{
    const seen=new Set();
    arr.forEach(item=>{
      seen.add(item.id);const s=JSON.stringify(item);
      if(map[item.id]!==s){batch.set(fsdb.collection(colName).doc(item.id),item);map[item.id]=s;any=true}
    });
    Object.keys(map).forEach(id=>{if(!seen.has(id)){batch.delete(fsdb.collection(colName).doc(id));delete map[id];any=true}});
  };
  diff('vendors',db.vendors,lastCloud.vendors);
  diff('reviews',db.reviews,lastCloud.reviews);
  diff('leads',db.leads,lastCloud.leads);
  const meta={cats:db.cats,areas:db.areas},metaStr=JSON.stringify(meta);
  if(metaStr!==lastCloud.meta){batch.set(fsdb.collection('meta').doc('config'),meta);lastCloud.meta=metaStr;any=true}
  if(any)batch.commit().then(cloudOk).catch(cloudErr);
}

function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const M=640,s=Math.min(1,M/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};
      im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

      <td><div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sm" data-act="editvendor" data-id="${v.id}">${tr('Edit')}</button>
        ${v.status!=='active'?`<button class="btn sm pri" data-act="approve" data-id="${v.id}">${tr('Approve')}</button>`:`<button class="btn sm danger" data-act="block" data-id="${v.id}">${tr('Block')}</button>`}

        <button class="btn sm" data-act="openpanel" data-id="${v.id}">${tr('Services and photos')}</button></div></td></tr>`}).join('');
    body=`<div class="stats" style="margin:0 0 14px"><div class="stat"><b>${act}</b><span>${tr('Live vendors')}</span></div><div class="stat"><b>${pen}</b><span>${tr('Waiting for approval')}</span></div><div class="stat"><b>₹${(act*FEE).toLocaleString('en-IN')}</b><span>${tr('Monthly income at ₹{fee}',{fee:FEE})}</span></div><div class="stat"><b>${db.leads.length}</b><span>${tr('Customer actions')}</span></div></div>
    <div class="scroll"><table><thead><tr><th>${tr('Vendor')}</th><th>${tr('Category')}</th><th>${tr('Status')}</th><th>${tr('Plan')}</th><th>${tr('Actions')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:28px">${tr('Admin')}</h1><button class="btn sm" data-act="adminout">${tr('Sign out')}</button></div>
  <div class="tabs">${T('vendors',tr('Vendors'))}${T('cats',tr('Service categories'))}${T('areas',tr('Areas'))}</div>${body}
  <p style="margin-top:22px"><button class="btn sm danger" data-act="reset">${ui.resetArm?tr('Click again to erase all data'):tr('Reset demo data')}</button></p>`;

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');
  if(!t){const c=e.target.closest('[data-go]');if(c&&!e.target.closest('a,button'))location.hash=c.dataset.go;return}
  const a=t.dataset.act,id=t.dataset.id,v=id?vendorById(id):null;
  const val=i=>($('#'+i)||{value:''}).value.trim();
  switch(a){
    case 'lang':lang=id==='ta'?'ta':'en';try{localStorage.setItem(LKEY,lang)}catch(err){}closeDlg();applyLang();break;
    case 'cat':ui.cat=ui.cat===id?'':id;paintCats();paintList();break;
    case 'deltoggle':ui.del=!ui.del;$('#dbtn').classList.toggle('on',ui.del);paintList();break;
    case 'call':logLead(id,'call');break;
    case 'wa':logLead(id,'whatsapp');break;
    case 'enq':openEnquiry(id,t.dataset.del==='1');break;
    case 'close':closeDlg();break;
    case 'sendenq':{
      const n=val('en'),p=val('ep'),m=val('em'),wd=!!($('#ed')&&$('#ed').checked),ad=val('ea');
      if(!n||digits(p).length<10||!m){toast('Enter your name, a 10 digit phone number and your message.');break}
      if(wd&&!ad){toast('Enter the delivery address.');break}
      logLead(id,'enquiry',{name:n,phone:p,msg:m,area:val('ear'),delivery:wd,address:wd?ad:''});closeDlg();toast('Enquiry sent to the vendor.');break}
    case 'rate':ui.rate=+t.dataset.n;document.querySelectorAll('#stars button').forEach((b,i)=>b.classList.toggle('on',i<ui.rate));break;
    case 'postrev':{
      const n=val('rn'),tx=val('rt');
      if(!n){toast('Please enter your name.');break}
      db.reviews.push({id:uid(),vid:id,ownerUid:(vendorById(id)||{}).ownerUid||'',name:n,rating:ui.rate,text:tx,ts:Date.now(),reply:''});
      if(save()){toast('Thank you for your feedback.');ui.rate=5;render()}break}
    case 'login':await doVendorLogin();break;
    case 'adminlogin':await doAdminLogin();break;
    case 'logout':if(isAdmin){db.session=null;render()}else{await (fbAuth()||NOFB).signOut()}break;
    case 'adminout':await (fbAuth()||NOFB).signOut();location.hash='#/';break;
    case 'register':{
      const n=val('rgn'),p=val('rgp'),pw=($('#rgw')||{}).value||'';
      if(!n||digits(p).length<10){toast('Enter business name and a 10 digit phone number.');break}
      const ar=pickedAreas('rga');
      if(!ar.length){toast('Add at least one area.');break}
      if(pw.length<6){toast('Password must be at least 6 characters.');break}
      let cu;try{cu=await (fbAuth()||NOFB).createUserWithEmailAndPassword(authEmail(p),pw)}catch(er){toast(authMsg(er));break}
      const nv={id:'v'+uid(),ownerUid:cu.user.uid,name:n,owner:val('rgo'),cat:$('#rgc').value,areas:ar,phone:p,about:val('rgb'),status:'pending',paidUntil:Date.now()+30*DAY,cover:null,views:0,delivery:{on:$('#rgdl').checked,info:val('rgdi')},services:[]};
      db.vendors.push(nv);db.session=nv.id;ui.tab='svc';save();attachLeads();render();toast('Registered. Add your services while you wait for approval.');break}
    case 'togglearea':t.classList.toggle('on');break;
    case 'igrp':ui.igrp=+id;paintIcons();break;
    case 'pickicon':{
      ui.icon=t.dataset.i;ui.tmp=null;
      const ce=$('#ce');if(ce)ce.value=ui.icon;
      const pv=$('#svcprev')||$('#covprev');if(pv)pv.src=ph(ui.icon,ui.hue||200);
      paintIcons();break}
    case 'tab':ui.tab=id;render();break;
    case 'renew':if(v){v.paidUntil=Math.max(Date.now(),v.paidUntil)+30*DAY;save();render();toast('Plan extended by 30 days.')}break;
    case 'reply':{const r=db.reviews.find(x=>x.id===id);if(r){r.reply=val('rp'+id);save();toast('Reply saved.')}break}
    case 'addsvc':openService(id,'');break;
    case 'editsvc':openService(id,t.dataset.sid);break;
    case 'delsvc':v.services=v.services.filter(s=>s.id!==t.dataset.sid);save();render();toast('Service deleted.');break;
    case 'savesvc':{
      const title=val('sn');if(!title){toast('Enter the service name.');break}
      const sid=t.dataset.sid;let s=v.services.find(x=>x.id===sid);
      if(!s){s={id:uid(),e:cat(v.cat).e};v.services.push(s)}
      s.title=title;s.price=val('sp');s.desc=val('sd');s.photo=ui.tmp||null;
      if(ui.icon)s.e=ui.icon;
      if(save()){ui.icon=null;closeDlg();render();toast('Service saved.')}break}
    case 'saveprof':{
      const n=val('pn');if(!n){toast('Enter the business name.');break}
      const pa=pickedAreas('pa');
      if(!pa.length){toast('Add at least one area.');break}
      v.name=n;v.owner=val('po');v.cat=$('#pc').value;v.areas=pa;v.phone=val('pp');v.about=val('pb');
      v.delivery={on:$('#pdl').checked,info:val('pdi')};
      if(ui.tmp)v.cover=ui.tmp;
      if(ui.icon){v.icon=ui.icon;if(!ui.tmp)v.cover=null}
      if(save()){ui.tmp=null;ui.icon=null;render();toast('Profile saved.')}break}
    case 'atab':ui.atab=id;render();break;
    case 'addcat':openCat('');break;
    case 'editcat':openCat(id);break;
    case 'savecat':{
      const n=val('cn'),tm=val('ct'),e=val('ce')||'🛠️',cid=t.dataset.cid;
      if(!n){toast('Enter the category name.');break}
      if(db.cats.some(x=>x.id!==cid&&x.n.toLowerCase()===n.toLowerCase())){toast('This category already exists.');break}
      if(cid){const c=db.cats.find(x=>x.id===cid);c.n=n;c.t=tm;c.e=e}
      else db.cats.push({id:'c'+uid(),n,t:tm,e,h:hueOf(n)});
      if(save()){closeDlg();render();toast('Category saved.')}break}
    case 'delcat':{
      const n=db.vendors.filter(x=>x.cat===id).length;
      if(n){toast('{n} vendor(s) use this category. Change their category first.',{n});break}
      if(db.cats.length<=1){toast('Keep at least one category.');break}
      db.cats=db.cats.filter(c=>c.id!==id);if(ui.cat===id)ui.cat='';save();render();toast('Category deleted.');break}
    case 'addarea':openArea('');break;
    case 'editarea':openArea(id);break;
    case 'savearea':{
      const n=val('an'),old=t.dataset.old;
      if(!n){toast('Enter the area name.');break}
      if(db.areas.some(x=>x!==old&&x.toLowerCase()===n.toLowerCase())){toast('This area already exists.');break}
      if(old){db.areas=db.areas.map(x=>x===old?n:x);
        db.vendors.forEach(x=>{x.areas=vAreas(x).map(a=>a===old?n:a)});
        if(ui.area===old)ui.area=n}
      else db.areas.push(n);
      if(save()){closeDlg();render();toast('Area saved.')}break}
    case 'delarea':{
      const n=db.vendors.filter(x=>vAreas(x).includes(id)).length;
      if(n){toast('{n} vendor(s) are in this area. Change their area first.',{n});break}
      if(db.areas.length<=1){toast('Keep at least one area.');break}
      db.areas=db.areas.filter(x=>x!==id);if(ui.area===id)ui.area='';save();render();toast('Area deleted.');break}
    case 'editvendor':openVendorEdit(id);break;
    case 'savevendor':{
      const n=val('vn');
      if(!n||digits(val('vp')).length<10){toast('Enter the business name and a 10 digit phone number.');break}
      const vas=pickedAreas('va');
      if(!vas.length){toast('Add at least one area.');break}
      v.name=n;v.owner=val('vo');v.cat=$('#vc').value;v.areas=vas;v.phone=val('vp');v.about=val('vb');v.status=$('#vs').value;
      v.delivery={on:$('#vdl').checked,info:val('vdi')};
      const d=$('#vpd').value;if(d)v.paidUntil=new Date(d+'T23:59:59').getTime();
      if(ui.tmp)v.cover=ui.tmp;
      if(ui.icon){v.icon=ui.icon;if(!ui.tmp)v.cover=null}
      if(save()){ui.tmp=null;ui.icon=null;closeDlg();render();toast('Vendor updated.')}break}
    case 'delvendor':
      if(ui.delArm!==id){ui.delArm=id;t.textContent=tr('Click again to delete');break}
      db.vendors=db.vendors.filter(x=>x.id!==id);db.leads=db.leads.filter(l=>l.vid!==id);db.reviews=db.reviews.filter(r=>r.vid!==id);
      if(db.session===id)db.session=null;ui.delArm=null;save();closeDlg();render();toast('Vendor deleted.');break;
    case 'openpanel':db.session=id;ui.tab='svc';save();location.hash='#/vendor';break;
    case 'approve':if(v){v.status='active';save();render()}break;
    case 'block':if(v){v.status='blocked';save();render()}break;
    case 'reset':
      if(!ui.resetArm){ui.resetArm=true;render();setTimeout(()=>{ui.resetArm=false;if(location.hash.startsWith('#/admin'))render()},4000)}
      else{db=seed();ui.resetArm=false;save();render();toast('Demo data restored.')}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;paintList();return}
  const box=t.closest&&t.closest('.ac');
  if(box)acPaint(box,true);
});
document.addEventListener('focusin',e=>{
  const box=e.target.closest&&e.target.closest('.ac');
  document.querySelectorAll('.ac').forEach(b=>{if(b!==box)acPaint(b,false)});
  if(box&&box.dataset.just==='1'){delete box.dataset.just;return}
  if(box&&e.target.tagName==='INPUT')acPaint(box,true);
});
document.addEventListener('mousedown',e=>{
  const opt=e.target.closest&&e.target.closest('.aclist button');
  if(opt){
    if(opt.disabled)return;
    e.preventDefault();
    const box=opt.closest('.ac'),inp=box.querySelector('input');
    inp.value=opt.dataset.v;
    acPaint(box,false);box.dataset.just='1';inp.focus();acPaint(box,false);
  }else if(!(e.target.closest&&e.target.closest('.ac')))acCloseAll();
});
document.addEventListener('keydown',e=>{
  const box=e.target.closest&&e.target.closest('.ac');if(!box)return;
  const list=box.querySelector('.aclist'),inp=box.querySelector('input');
  if(e.key==='Escape'){acPaint(box,false)}
  else if(e.key==='ArrowDown'){acPaint(box,true)}
  else if(e.key==='Enter'){
    e.preventDefault();
    const first=list&&!list.hidden&&list.querySelector('button[data-v]:not([disabled])');
    const pick=inp.value.trim()?inp.value.trim():(first&&first.dataset.v?first.dataset.v:'');
    if(pick){inp.value=pick;acPaint(box,false);if(inp.id==='area'){ui.area=pick;paintList()}}
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='area'){ui.area=t.value;paintList()}
  else if(t.id==='ed'){const w=$('#eaw');if(w)w.hidden=!t.checked}
  else if(t.dataset.lead){const l=db.leads.find(x=>x.id===t.dataset.lead);if(l){l.status=t.value;save();toast('Status updated.')}}
  else if(t.dataset.photo&&t.files&&t.files[0]){
    try{ui.tmp=await readPhoto(t.files[0]);ui.icon=null;paintIcons();const p=$(t.dataset.photo==='cover'?'#covprev':'#svcprev');if(p)p.src=ui.tmp}
    catch(err){toast('Could not read that photo. Try another one.')}
  }
});

/* ---------- router and language ---------- */
function route(count){
  const h=location.hash||'#/';
  document.querySelectorAll('#nav a').forEach(a=>{
    const k=a.dataset.n;
    a.classList.toggle('on',(k==='vendor'&&h.startsWith('#/vendor'))||(k==='admin'&&h.startsWith('#/admin'))||(k==='home'&&!h.startsWith('#/vendor')&&!h.startsWith('#/admin')));
  });
  let m;
  if((m=h.match(/^#\/v\/(.+)$/))){if(count)bumpView(m[1]);renderVendor(m[1])}
  else if(h.startsWith('#/vendor'))renderPanel();
  else if(h.startsWith('#/admin'))renderAdmin();
  else renderHome();
}
const render=()=>route(false);
function applyLang(){
  document.documentElement.lang=lang;
  const names={home:'Find services',vendor:'Vendor panel',admin:'Admin'};
  document.querySelectorAll('#nav a').forEach(a=>{a.textContent=tr(names[a.dataset.n])});
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.id===lang));
  $('#foot').textContent=tr('Note: everything you add syncs automatically across all your devices. Photos are resized before saving.');
  render();
}
window.addEventListener('hashchange',()=>{route(true);window.scrollTo(0,0)});
applyLang();

/* ---------- PWA install support ----------
   Registers sw.js if it's hosted next to this HTML file. Safe to omit
   sw.js entirely -- the try/catch below means the app just runs as a
   normal page (with the manifest/icon still working for "Add to Home
   Screen" on iOS) if no service worker is present. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
